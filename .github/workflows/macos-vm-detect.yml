name: macOS VM detect

# 手动触发。每个 QQ macOS 版本 × 每个架构各跑一个 job，互相独立并发。
on:
  workflow_dispatch:
    inputs:
      versions:
        description: '逗号分隔的版本过滤（留空 = 全部）'
        required: false
        default: ''
      only_arch:
        description: '只跑某个架构（intel / arm / 留空 = 两个都跑）'
        required: false
        default: ''
      repeat:
        description: '每个 job 对 VM 与 sign core 各连续调用的次数（默认 1）'
        required: false
        default: "1"
  # 非默认分支上的 workflow_dispatch 不会出现在手动触发列表里，
  # 所以再挂一个 push 触发，推到本分支就自动跑。
  push:
    branches: [weq/vm-detect]

jobs:
  # 生成 matrix：版本 × 架构
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          FILTER: ${{ inputs.versions }}
          ONLY_ARCH: ${{ inputs.only_arch }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, re

          # 直接读仓库里的 downloads.list.json，只取 macOS 的 dmg。
          catalog = json.load(open("downloads.list.json"))
          CATALOG = {
              item["version"]: item["url"]
              for item in catalog["items"]
              if item["platform"] == "macos" and item["type"] == "dmg"
          }

          # 过滤条件：workflow_dispatch 用 inputs.versions；
          # push 触发时读 commit message 里的 `run-versions: 7.0.3`。
          raw = os.environ.get("FILTER", "").strip()
          if not raw and os.environ.get("EVENT_NAME") == "push":
              msg = os.environ.get("COMMIT_MSG", "")
              m = re.search(r"run-versions:\s*([\w.,]+)", msg)
              if m:
                  raw = m.group(1)
          filt = [v.strip() for v in raw.split(",") if v.strip()]
          versions = [v for v in CATALOG if not filt or any(f in v for f in filt)]
          print("filter:", filt or "(全部)", "->", versions)

          # macOS 13/14 的 runner 已退役；当前可用的是 macos-15（arm64）
          # 和 macos-15-intel（x64），两个架构都能做动态签名验证。
          runners = {"intel": "macos-15-intel", "arm": "macos-15"}
          only = os.environ.get("ONLY_ARCH", "").strip()
          include = []
          for v in versions:
              for arch, runner in runners.items():
                  if only and arch != only:
                      continue
                  include.append({
                      "version": v,
                      "arch": arch,
                      "runner": runner,
                      "url": CATALOG[v],
                  })

          matrix = json.dumps({"include": include})
          print(matrix)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + matrix + "\n")
          PY

  detect:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.version }} / ${{ matrix.arch }}
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          echo "runner : ${{ matrix.runner }}"
          echo "arch   : $(uname -m)"
          sw_vers

      - name: 构建定位工具
        working-directory: tools/macos_vm_locator
        run: |
          make
          ./macos_vm_locator 2>&1 | head -5 || true

      - name: 缓存 dmg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/qq/qq.dmg
            ${{ runner.temp }}/qq/qq.dmg.ok
          key: qq-dmg-${{ matrix.version }}-${{ matrix.arch }}

      - name: 下载 dmg
        id: download
        timeout-minutes: 18
        env:
          URL: ${{ matrix.url }}
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qq"
          if [ -s "$RUNNER_TEMP/qq/qq.dmg" ] && [ -f "$RUNNER_TEMP/qq/qq.dmg.ok" ]; then
            code=200
            rc=0
            echo "download: cache hit"
          else
            rm -f "$RUNNER_TEMP/qq/qq.dmg.ok"
            echo "download: start $(date -u +%FT%TZ)"
            set +e
            code=$(curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
                     --connect-timeout 20 --max-time 900 \
                     --speed-limit 1024 --speed-time 60 \
                     -o "$RUNNER_TEMP/qq/qq.dmg" -w '%{http_code}' "$URL")
            rc=$?
            set -e
            echo "download: curl rc=$rc http=$code $(date -u +%FT%TZ)"
            if [ "$rc" -ne 0 ]; then code=000; fi
          fi
          if [ "$code" != "200" ] || [ ! -s "$RUNNER_TEMP/qq/qq.dmg" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${VERSION} 的 dmg 下载失败（curl rc=${rc:-?} http=${code}）"
            {
              echo "### $VERSION / ${{ matrix.arch }}"
              echo "dmg 下载失败（curl rc=${rc:-?} http=${code}），跳过。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          touch "$RUNNER_TEMP/qq/qq.dmg.ok"
          echo "available=true" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/qq/qq.dmg"
          file "$RUNNER_TEMP/qq/qq.dmg"

      - name: 解包 wrapper.node
        id: extract
        if: steps.download.outputs.available == 'true'
        timeout-minutes: 12
        env:
          VERSION: ${{ matrix.version }}
        run: |
          set -euo pipefail
          cd tools/macos_vm_locator

          echo "=== 提取 wrapper.node $(date -u +%FT%TZ) ==="
          set +e
          WRAPPER="$(./extract_wrapper.sh "$RUNNER_TEMP/qq/qq.dmg" "$RUNNER_TEMP/qq/wrapper.node" 2>"$RUNNER_TEMP/qq/extract.log")"
          ext_rc=$?
          set -e
          cat "$RUNNER_TEMP/qq/extract.log"
          echo "extract exit=$ext_rc $(date -u +%FT%TZ)"
          echo "wrapper = $WRAPPER"
          if [ -z "$WRAPPER" ] || [ ! -f "$WRAPPER" ]; then
            echo "::error::提取 wrapper.node 失败（exit=${ext_rc}）"
            {
              echo "### $VERSION / ${{ matrix.arch }}"
              echo "提取失败（exit=${ext_rc}）："
              echo '```'
              cat "$RUNNER_TEMP/qq/extract.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "wrapper=$WRAPPER" >> "$GITHUB_OUTPUT"
          ls -lh "$WRAPPER"
          file "$WRAPPER"

      - name: 定位 + 验证
        id: locate
        if: steps.extract.outputs.wrapper != ''
        timeout-minutes: 10
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ matrix.version }}
          WRAPPER: ${{ steps.extract.outputs.wrapper }}
          REPEAT: ${{ inputs.repeat || '1' }}
          COMMIT_MSG2: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          cd tools/macos_vm_locator

          echo
          echo "=== 定位 + 验证 ($ARCH) $(date -u +%FT%TZ) ==="
          rep="${REPEAT:-1}"
          if [ "$rep" = "1" ]; then
            m=$(printf '%s' "${COMMIT_MSG2:-}" | grep -o 'run-repeat:[[:space:]]*[0-9]*' || true)
            if [ -n "$m" ]; then rep=$(printf '%s' "$m" | grep -o '[0-9]*'); fi
          fi
          echo "repeat=$rep"

          # 默认同时验证 VM 分发器与 sign core：只有这两条都真正执行成功，
          # 才能说明这个版本可用。以前只调 sign core，VM 从未被执行过。
          if ./macos_vm_locator "$WRAPPER" "$ARCH" --repeat "$rep" --target both \
            > "$RUNNER_TEMP/qq/result.txt" 2>&1; then
            verify_rc=0
          else
            verify_rc=$?
          fi
          cat "$RUNNER_TEMP/qq/result.txt"

          echo "exit=$verify_rc $(date -u +%FT%TZ)"

          # 这里是真实验证：任何崩溃或错误都判红，不再降级成 warning。
          if [ "$verify_rc" -ge 128 ]; then
            sig=$(kill -l "$((verify_rc-128))" 2>/dev/null || echo signal)
            echo "::error::验证被 ${sig} 终止（exit=${verify_rc}）"
          elif [ "$verify_rc" -ne 0 ]; then
            echo "::error::VM / sign core 验证未通过（exit=${verify_rc}）"
          fi
          {
            echo "### $VERSION / $ARCH"
            echo '```'
            cat "$RUNNER_TEMP/qq/result.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$verify_rc"


      - name: 汇总到 artifact
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/qq/result.txt" "$RUNNER_TEMP/out/${{ matrix.version }}-${{ matrix.arch }}.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/qq/extract.log" "$RUNNER_TEMP/out/${{ matrix.version }}-${{ matrix.arch }}-extract.log" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/
          if-no-files-found: warn
          retention-days: 14

      - name: 清理挂载
        if: always()
        run: |
          mount | grep -i "QQ.app" || true
          hdiutil detach "$RUNNER_TEMP"/qq/mnt 2>/dev/null || true
          for m in $(mount | grep -o '/var/folders[^ ]*mnt' || true); do
            hdiutil detach "$m" 2>/dev/null || true
          done
