name: Windows VM detect

# Windows 的 wrapper.node 用 LLVM/PE 容器，静态定位不能复用 macos 那个 C++ 工具。
# 这里**不引入 nt_helper 源码**：直接取它 Docker 化的发布产物
# （`weq-devs/nt_helper_release` 的 `nt_helper-win32-x64.node`），用 Node 加载后
# 调 `checkSigner()` —— 这个接口就是「扫 sign core → 扫 VM → 连签一次」。
#
# 需要更新的东西（比如 9.9.37 的 VM 直接调用还没在 Windows 上验过）**只报告、
# 不修**：本 workflow 的职责是把问题暴露出来。
on:
  workflow_dispatch:
    inputs:
      versions:
        description: '逗号分隔的版本过滤（留空 = 全部）'
        required: false
        default: ''
      repeat:
        description: '每份 wrapper 连续签名次数（默认 1）'
        required: false
        default: "1"
      release_tag:
        description: 'nt_helper 发布 tag（留空 = 最新）'
        required: false
        default: ''
  # 非默认分支上的 workflow_dispatch 不出现在手动列表里，所以再挂 push。
  push:
    branches: [weq/windows-vm-detect]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        env:
          FILTER: ${{ inputs.versions }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          python3 - <<'PY'
          import json, os, re

          catalog = json.load(open("downloads.list.json"))
          ITEMS = [
              item for item in catalog["items"]
              if item["platform"] == "windows" and item["type"] == "exe"
          ]

          raw = os.environ.get("FILTER", "").strip()
          if not raw and os.environ.get("EVENT_NAME") == "push":
              m = re.search(r"run-versions:\s*([\w.,]+)", os.environ.get("COMMIT_MSG", ""))
              if m:
                  raw = m.group(1)
          filt = [v.strip() for v in raw.split(",") if v.strip()]

          include = []
          for item in ITEMS:
              if filt and not any(f in item["version"] for f in filt):
                  continue
              include.append({
                  "version": item["version"],
                  "arch": item["arch"],
                  "url": item["url"],
              })
          print(json.dumps(include, indent=1))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
          PY

  detect:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: windows-latest
    name: ${{ matrix.version }} / ${{ matrix.arch }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 用发布产物而不是现场编译：Rust + napi 一次要十几分钟，而这个 workflow
      # 的目的是验证 **QQ 的 wrapper.node**，不是验证 nt_helper 能不能编。
      - name: Fetch nt_helper (prebuilt win32-x64)
        id: native
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          repo="weq-devs/nt_helper_release"
          tag="${RELEASE_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$repo" --json tagName -q .tagName)
          fi
          echo "release=$tag"
          mkdir -p "$RUNNER_TEMP/native"
          gh release download "$tag" --repo "$repo" \
            --pattern 'nt_helper-win32-x64.node' \
            --dir "$RUNNER_TEMP/native"
          ls -lh "$RUNNER_TEMP/native"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # 这个 workflow 只依赖 checkSigner 一个接口。老产物没有它就明确停下，
          # 而不是等调用时报「不是函数」。换 release_tag 即可指定新构建。
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(process.cwd() + "/");
            const nt = require(process.env.RUNNER_TEMP + "/native/nt_helper-win32-x64.node");
            if (typeof nt.checkSigner !== "function") {
              console.error("该 nt_helper 产物缺少 checkSigner；请用带该接口的新构建（--release_tag 指定 tag）");
              process.exit(1);
            }
            console.log("checkSigner ok; build:", JSON.stringify(nt.getBuildInfo?.() ?? null));
          '

      - name: Download installer
        id: download
        shell: bash
        env:
          URL: ${{ matrix.url }}
          VERSION: ${{ matrix.version }}
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/qq"
          code=$(curl -sSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/qq/qq.exe" \
                   -w '%{http_code}' "$URL" || echo 000)
          size=$(stat -c%s "$RUNNER_TEMP/qq/qq.exe" 2>/dev/null || echo 0)
          echo "http=$code size=$size"
          if [ "$code" != "200" ] || [ "$size" -lt 10000000 ]; then
            # 腾讯 CDN 会删旧版本；不可下载只记 warning，不判红。
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${VERSION} 的安装包已不可下载（http=${code} size=${size}）"
            {
              echo "### $VERSION / ${{ matrix.arch }}"
              echo "安装包已不可下载（http=${code} size=${size}）。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/qq/qq.exe"

      # 静默解包：QQ 的 NSIS 安装器支持 /S /D=。装到临时目录，测完随 runner 销毁。
      - name: Extract wrapper.node
        id: extract
        if: steps.download.outputs.available == 'true'
        shell: pwsh
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'qq\installed'
          Write-Host "installing to $target"
          $p = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'qq\qq.exe') `
            -ArgumentList '/S', "/D=$target" -Wait -PassThru
          Write-Host "installer exit=$($p.ExitCode)"

          $wrapper = Get-ChildItem -Path $target -Recurse -Filter 'wrapper.node' -ErrorAction SilentlyContinue |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $wrapper) {
            Write-Host "::error::解包后没找到 wrapper.node"
            Get-ChildItem -Path $target -Recurse -Depth 3 -ErrorAction SilentlyContinue |
              Select-Object -First 50 FullName | Out-String | Write-Host
            exit 1
          }
          Write-Host "wrapper = $($wrapper.FullName) ($('{0:N0}' -f $wrapper.Length) bytes)"
          "wrapper=$($wrapper.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # package.json 就在同级，版本号以它为准。
          $pkg = Join-Path $wrapper.DirectoryName 'package.json'
          if (Test-Path $pkg) {
            $v = (Get-Content $pkg -Raw | ConvertFrom-Json).version
            Write-Host "package.json version = $v"
            "pkgversion=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Locate + sign
        id: verify
        if: steps.extract.outputs.wrapper != ''
        shell: bash
        env:
          WRAPPER: ${{ steps.extract.outputs.wrapper }}
          VERSION: ${{ matrix.version }}
          REPEAT: ${{ inputs.repeat || '1' }}
          NATIVE_MODULE: ${{ runner.temp }}/native/nt_helper-win32-x64.node
        run: |
          set -uo pipefail
          export NT_HELPER_WRAPPER_NODE="$WRAPPER"
          export NT_HELPER_REPEAT="$REPEAT"
          set +e
          node --input-type=module -e '
            import { createRequire } from "node:module";
            const require = createRequire(process.cwd() + "/");
            const nt = require(process.env.NATIVE_MODULE);
            const path = process.env.NT_HELPER_WRAPPER_NODE;
            const repeat = Number(process.env.NT_HELPER_REPEAT || 1);
            const out = { wrapper: path, repeat };
            out.buildInfo = nt.getBuildInfo?.() ?? null;
            out.initStatus = nt.getInitStatus?.() ?? null;
            try {
              out.check = nt.checkSigner(path, repeat);
            } catch (e) {
              out.checkError = String(e && e.message || e);
            }
            console.log(JSON.stringify(out, null, 2));
            process.exit(out.checkError || (out.check && out.check.failures) ? 1 : 0);
          ' > "$RUNNER_TEMP/qq/result.json" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/qq/result.json"

          if [ "$rc" -ge 128 ]; then
            sig=$((rc-128))
            echo "::error::签名验证被信号 $sig 终止（exit=$rc）"
          elif [ "$rc" -ne 0 ]; then
            echo "::error::定位/签名验证未通过（exit=$rc）"
          fi

          {
            echo "### $VERSION / ${{ matrix.arch }}"
            echo '```json'
            cat "$RUNNER_TEMP/qq/result.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/qq/result.json
          if-no-files-found: warn
          retention-days: 14
